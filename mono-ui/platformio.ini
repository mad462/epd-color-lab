; PlatformIO project: 3.7" JD7601 (GDEH037E01-class) 720x480 six-color EPD
; Goal: reproduce FrameFilm's 48-color scheme (8bpp index -> two 3-bit planes
;       -> multi-phase refresh with custom 799-byte waveforms)
;
; Target : OSPTEK ESP32-S3 Demo V1.3 on COM6
; Wiring : BUSY=42 CS=41 DC=40 RST=39 SDA=38 SCL=47   (same header as always)
;
; Standalone: shares no code/output with ..\jd7601 ..\e6-730 ..\epd0356

[platformio]
src_dir = main

[env:esp32s3]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc1-n16r8

upload_port = COM6
upload_speed = 115200
monitor_port = COM6
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -Wall
    -O2          ; ESP-IDF 默认 -Og，编码循环慢不少

board_build.flash_size = 16MB

; 默认 singleapp 只给 app 1 MB，加了 WiFi 栈之后超过 1 MB 就装不下
board_build.partitions = partitions.csv
