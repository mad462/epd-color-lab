<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>48色墨水屏 · 传图台</title>
    <style>
        :root {
            --bg: #14161a; --panel: #1c1f26; --panel2: #232733; --line: #2e3340;
            --tx: #e6e9ef; --dim: #8b93a5; --acc: #4c8dff; --ok: #35c07a;
            --warn: #e0a33c; --err: #e05c5c;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--tx);
               font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }

        header { padding: 12px 20px; border-bottom: 1px solid var(--line);
                 display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
                 position: sticky; top: 0; background: var(--bg); z-index: 10; }
        h1 { font-size: 16px; margin: 0; font-weight: 600; white-space: nowrap; }
        .spacer { flex: 1; }
        button { background: var(--panel2); color: var(--tx); border: 1px solid var(--line);
                 border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
        button:hover:not(:disabled) { border-color: #4a5164; }
        button:disabled { opacity: .4; cursor: not-allowed; }
        button.primary { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
        button.big { padding: 9px 26px; font-size: 15px; }
        button.small { padding: 5px 10px; font-size: 13px; }
        select, input[type=text], input[type=number] {
            background: var(--panel2); color: var(--tx); border: 1px solid var(--line);
            border-radius: 8px; padding: 7px 10px; font: inherit; }
        .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px;
                border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--dim); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

        /* 三栏：原图 | 量化 | 参数 */
        main { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 350px;
               gap: 16px; padding: 16px 20px 40px; align-items: start; }
        @media (max-width: 1150px) { main { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
                                     #settingsCol { grid-column: 1 / -1; } }

        .card { background: var(--panel); border: 1px solid var(--line);
                border-radius: 12px; padding: 12px; }
        .card h2 { font-size: 12px; margin: 0 0 10px; color: var(--dim);
                   font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }

        .view { position: relative; }
        .view canvas { width: 100%; height: auto; border: 1px solid var(--line);
                       border-radius: 8px; background: #0e1014; display: block;
                       image-rendering: pixelated; }
        /* 空状态：提示放在预览框正中间 */
        .empty { position: absolute; inset: 0; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; gap: 10px;
                 color: var(--dim); text-align: center; padding: 20px;
                 border: 1.5px dashed var(--line); border-radius: 8px; background: #0e1014; }
        .empty b { color: var(--tx); font-size: 15px; }
        .empty.hide { display: none; }
        .empty button { pointer-events: auto; }

        label.opt { display: flex; flex-direction: column; gap: 5px;
                    font-size: 12.5px; color: var(--dim); }
        .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .row + .row { margin-top: 12px; }
        .rg { display: flex; align-items: center; gap: 7px; }
        .rg input[type=range] { width: 96px; }
        .rg input[type=number] { width: 62px; padding: 4px 6px; text-align: center; font-size: 13px; }
        .hint { color: var(--dim); font-size: 12.5px; margin-top: 10px; }

        details.adv { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
        details.adv > summary { cursor: pointer; color: var(--dim); font-size: 12.5px;
                                list-style: none; user-select: none; }
        details.adv > summary::-webkit-details-marker { display: none; }
        details.adv > summary::before { content: "▸ "; }
        details.adv[open] > summary::before { content: "▾ "; }
        details.adv > summary:hover { color: var(--tx); }

        #statusLine { padding: 0 20px 8px; color: var(--dim); font-size: 12.5px;
                      min-height: 20px; white-space: nowrap; overflow: hidden;
                      text-overflow: ellipsis; }

        #dropOverlay { position: fixed; inset: 0; z-index: 999; display: none;
                       align-items: center; justify-content: center;
                       background: rgba(20, 26, 40, .88); border: 3px dashed var(--acc);
                       color: var(--tx); font-size: 22px; font-weight: 600;
                       pointer-events: none; }
        #dropOverlay.on { display: flex; }

        #bar { height: 6px; background: var(--panel2); border-radius: 99px;
               overflow: hidden; margin-top: 10px; }
        #prog { display: block; height: 100%; width: 0; background: var(--acc); transition: width .2s; }
    </style>
</head>

<body>
    <div id="dropOverlay">松手即可载入图片</div>

    <header>
        <h1>48色墨水屏 · 传图台</h1>
        <span class="pill"><span class="dot" id="dot"></span><span id="status">就绪</span></span>

        <label class="opt" style="flex-direction:row;align-items:center;gap:6px">设备 IP
            <input type="text" id="ipAddr" placeholder="192.168.x.x" style="width:132px">
        </label>
        <button class="small" id="btnProbe">从串口读取</button>

        <span class="spacer"></span>
        <button id="btnSend" class="primary big" disabled>下发</button>
    </header>
    <div id="statusLine">还没读到设备 IP —— 点「从串口读取」，或在串口里敲 e 看设备打印的地址。</div>

    <main>
        <!-- 列 1：原图 -->
        <div class="card">
            <h2>原图（裁剪后）</h2>
            <div class="view">
                <canvas id="cvSrc" width="480" height="720"></canvas>
                <div class="empty" id="emptyHint">
                    <b>把图片拖到页面任意位置</b>
                    <div>或 Ctrl+V 粘贴</div>
                    <button class="small" id="btnPick">选择图片</button>
                    <input type="file" id="file" accept="image/*" hidden>
                </div>
            </div>
        </div>

        <!-- 列 2：量化预览 -->
        <div class="card">
            <h2>量化后（将下发到设备）</h2>
            <div class="view"><canvas id="cvDst" width="480" height="720"></canvas></div>
            <div id="bar"><i id="prog"></i></div>
            <div class="hint" id="txHint">—</div>
        </div>

        <!-- 列 3：参数 -->
        <div class="card" id="settingsCol">
            <h2>参数</h2>

            <div class="row">
                <label class="opt">色板 <select id="selPalette"></select></label>
            </div>
            <div class="row">
                <label class="opt">抖动 <select id="selDither">
                        <option value="floyd-steinberg" selected>Floyd Steinberg（推荐）</option>
                        <option value="atkinson">Atkinson</option>
                        <option value="stucki">Stucki</option>
                        <option value="burkes">Burkes</option>
                        <option value="sierra">Sierra</option>
                        <option value="none">不使用抖动</option>
                    </select></label>
            </div>
            <div class="row">
                <label class="opt">构图尺寸 <select id="selSize">
                        <option value="720x480">720 × 480（设备原生）</option>
                        <option value="480x720" selected>480 × 720 竖版（设备转正）</option>
                    </select></label>
            </div>

            <div class="row">
                <label class="opt">亮度 <span class="rg">
                        <input type="range" id="rBright" min="-40" max="40" value="-11">
                        <input type="number" id="rBrightNum" min="-40" max="40" value="-11"></span></label>
            </div>
            <div class="row">
                <label class="opt">对比度 <span class="rg">
                        <input type="range" id="rContrast" min="-40" max="40" value="0">
                        <input type="number" id="rContrastNum" min="-40" max="40" value="0"></span></label>
            </div>
            <div class="row">
                <label class="opt">饱和度 <span class="rg">
                        <input type="range" id="rSat" min="0" max="80" value="0">
                        <input type="number" id="rSatNum" min="0" max="80" value="0"></span></label>
            </div>

            <div class="row" style="margin-top:14px">
                <span style="color:var(--dim);font-size:12.5px">预设</span>
                <button class="small preset" data-preset="std">标准</button>
                <button class="small preset" data-preset="bright">提亮</button>
                <button class="small preset" data-preset="vivid">浓一点</button>
                <button class="small preset" data-preset="rescue">救高光</button>
            </div>
            <div class="row">
                <button class="small" id="btnSaveDefault"
                        title="把当前所有参数存成下次打开的默认值">存为默认</button>
            </div>
            <div class="hint" id="toneInfo">—</div>

            <details class="adv">
                <summary>高级</summary>

                <div class="row">
                    <label class="opt">黑点 <span class="rg">
                            <input type="range" id="rBlack" min="0" max="90" value="60">
                            <input type="number" id="rBlackNum" min="0" max="90" value="60"></span></label>
                </div>
                <div class="row">
                    <label class="opt" style="flex-direction:row;gap:6px;align-items:center">
                        <input type="checkbox" id="cbBlackAuto" checked> 黑点自动跟随色板</label>
                </div>
                <div class="row">
                    <label class="opt">色偏微调 <span class="rg">
                            <input type="range" id="rTint" min="-20" max="20" value="-10">
                            <input type="number" id="rTintNum" min="-20" max="20" value="-10"></span></label>
                </div>
                <div class="row">
                    <label class="opt">明度权重 <span class="rg">
                            <input type="range" id="rLWeight" min="0.4" max="3" step="0.1" value="1.2">
                            <input type="number" id="rLWeightNum" min="0.4" max="3" step="0.1" value="1.2"></span></label>
                </div>
                <div class="row">
                    <label class="opt">阴影 <span class="rg">
                            <input type="range" id="rShadow" min="-100" max="100" value="0">
                            <input type="number" id="rShadowNum" min="-100" max="100" value="0"></span></label>
                </div>
                <div class="row">
                    <label class="opt">高光 <span class="rg">
                            <input type="range" id="rHighlight" min="-100" max="100" value="100">
                            <input type="number" id="rHighlightNum" min="-100" max="100" value="100"></span></label>
                </div>
                <div class="row">
                    <label class="opt">半径 <span class="rg">
                            <input type="range" id="rRadius" min="2" max="60" value="12">
                            <input type="number" id="rRadiusNum" min="2" max="60" value="12"></span></label>
                </div>
                <div class="row">
                    <label class="opt">抖动强度 <span class="rg">
                            <input type="range" id="rDither" min="0" max="150" value="100">
                            <input type="number" id="rDitherNum" min="0" max="150" value="100"></span></label>
                </div>
                <div class="row">
                    <label class="opt">映射到面板范围 <span class="rg">
                            <input type="range" id="rPanelMap" min="0" max="100" value="0">
                            <input type="number" id="rPanelMapNum" min="0" max="100" value="0"></span></label>
                </div>
                <div class="row">
                    <label class="opt" style="flex-direction:row;gap:6px;align-items:center">
                        <input type="checkbox" id="cbAuto" checked> 自动色阶</label>
                </div>
                <div class="row">
                    <label class="opt" style="flex-direction:row;gap:6px;align-items:center">
                        <input type="checkbox" id="cbSerpentine" checked> 蛇形扫描</label>
                </div>
                <div class="row">
                    <label class="opt" style="flex-direction:row;gap:6px;align-items:center"
                           title="源色越饱和越优先保色相。实测在暗部会引入断层，默认关">
                        <input type="checkbox" id="cbChromaGuard"> 饱和色保色相</label>
                </div>
                <div class="row">
                    <label class="opt" style="flex-direction:row;gap:6px;align-items:center"
                           title="按色度平滑压制误差扩散。实测在暗部会引入断层，默认关">
                        <input type="checkbox" id="cbPureSat"> 饱和色不抖动</label>
                </div>
                <div class="row">
                    <button class="small" id="btnResetTone">全部复位</button>
                </div>
                <div class="hint" id="mapInfo">—</div>
            </details>
        </div>
    </main>

    <script type="module">
        // ======================================================== 常量 / 工具
        const KERNELS = {
            'none': [],
            'floyd-steinberg': [[1, 0, 7 / 16], [-1, 1, 3 / 16], [0, 1, 5 / 16], [1, 1, 1 / 16]],
            'atkinson': [[1, 0, 1 / 8], [2, 0, 1 / 8], [-1, 1, 1 / 8], [0, 1, 1 / 8], [1, 1, 1 / 8], [0, 2, 1 / 8]],
            'stucki': [[1, 0, 8 / 42], [2, 0, 4 / 42], [-2, 1, 2 / 42], [-1, 1, 4 / 42], [0, 1, 8 / 42],
            [1, 1, 4 / 42], [2, 1, 2 / 42], [-2, 2, 1 / 42], [-1, 2, 2 / 42], [0, 2, 4 / 42],
            [1, 2, 2 / 42], [2, 2, 1 / 42]],
            'burkes': [[1, 0, 8 / 32], [2, 0, 4 / 32], [-2, 1, 2 / 32], [-1, 1, 4 / 32],
            [0, 1, 8 / 32], [1, 1, 4 / 32], [2, 1, 2 / 32]],
            'sierra': [[1, 0, 5 / 32], [2, 0, 3 / 32], [-2, 1, 2 / 32], [-1, 1, 4 / 32], [0, 1, 5 / 32],
            [1, 1, 4 / 32], [2, 1, 2 / 32], [-1, 2, 2 / 32], [0, 2, 3 / 32], [1, 2, 2 / 32]],
        };

        const el = (id) => document.getElementById(id);
        let lastMsg = '';

        function say(text, cls) {
            lastMsg = text;
            el('statusLine').textContent = text;
            el('statusLine').style.color =
                cls === 'l-err' ? 'var(--err)' : (cls === 'l-ok' ? 'var(--ok)' : 'var(--dim)');
        }

        // WiFi 直连：网页直接 POST 到设备。串口只在「从串口读取」IP 时用一次。
        function wifiBase() {
            const ip = el('ipAddr').value.trim().replace(/^https?:\/\//, '').replace(/\/+$/, '');
            return ip ? ('http://' + ip) : '';
        }

        async function api(path, opts = {}, timeoutMs = 300000) {
            const base = wifiBase();
            if (!base) {
                return { ok: false, err: '还没填设备 IP —— 点「从串口读取」，或在串口里敲 e 看' };
            }
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
                const res = await fetch(base + path, { ...opts, signal: ctrl.signal });
                return await res.json();
            } catch (e) {
                return { ok: false, err: '和设备通讯失败：' + e.message };
            } finally {
                clearTimeout(timer);
            }
        }

        // 调本地助手（只用来读设备 IP）
        async function assistant(path, timeoutMs = 40000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
                const res = await fetch(path, { signal: ctrl.signal });
                return await res.json();
            } catch (e) {
                return { ok: false, err: '本地助手没响应：' + e.message };
            } finally {
                clearTimeout(timer);
            }
        }

        // ======================================================== 色彩
        const SRGB = new Float32Array(256);
        for (let i = 0; i < 256; i++) {
            const c = i / 255;
            SRGB[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        }

        function rgbToLab(r, g, b) {
            const rl = SRGB[r] * 100, gl = SRGB[g] * 100, bl = SRGB[b] * 100;
            const x = (rl * 0.4124564 + gl * 0.3575761 + bl * 0.1804375) / 95.047;
            const y = (rl * 0.2126729 + gl * 0.7151522 + bl * 0.0721750) / 100;
            const z = (rl * 0.0193339 + gl * 0.1191920 + bl * 0.9503041) / 108.883;
            const f = (t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116);
            const fx = f(x), fy = f(y), fz = f(z);
            return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
        }

        function labToRgb(L, A, B) {
            const fy = (L + 16) / 116, fx = fy + A / 500, fz = fy - B / 200;
            const finv = (t) => (t * t * t > 0.008856 ? t * t * t : (t - 16 / 116) / 7.787);
            const x = finv(fx) * 0.95047, y = finv(fy), z = finv(fz) * 1.08883;
            const r = x * 3.2404542 + y * -1.5371385 + z * -0.4985314;
            const g = x * -0.9692660 + y * 1.8760108 + z * 0.0415560;
            const b = x * 0.0556434 + y * -0.2040259 + z * 1.0572252;
            const enc = (c) => {
                c = Math.max(0, Math.min(1, c));
                return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
            };
            return [Math.round(enc(r) * 255), Math.round(enc(g) * 255), Math.round(enc(b) * 255)];
        }

        function getSaturation(r, g, b) {
            const mx = Math.max(r, Math.max(g, b)) / 255;
            const mn = Math.min(r, Math.min(g, b)) / 255;
            return mx === 0 ? 0 : (mx - mn) / mx;
        }

        function smoothstep(e0, e1, x) {
            if (e1 <= e0) return x >= e1 ? 1 : 0;
            const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
            return t * t * (3 - 2 * t);
        }

        // ======================================================== 局部阴影/高光
        // PS 风格：用大半径模糊亮度图当蒙版，暗部区域和亮部区域互不干扰。
        function localLuma(data, w, h, scale) {
            const bw = Math.max(1, Math.round(w / scale));
            const bh = Math.max(1, Math.round(h / scale));
            const sum = new Float32Array(bw * bh);
            const cnt = new Float32Array(bw * bh);
            for (let y = 0; y < h; y++) {
                const by = Math.min(bh - 1, Math.floor(y * bh / h));
                for (let x = 0; x < w; x++) {
                    const bx = Math.min(bw - 1, Math.floor(x * bw / w));
                    const o = (y * w + x) * 4;
                    sum[by * bw + bx] += data[o] * 0.2126 + data[o + 1] * 0.7152 + data[o + 2] * 0.0722;
                    cnt[by * bw + bx]++;
                }
            }
            for (let i = 0; i < sum.length; i++) sum[i] /= Math.max(1, cnt[i]);
            let a = sum;
            for (let p = 0; p < 2; p++) a = boxBlurSmall(a, bw, bh, 2);
            return { map: a, bw, bh };
        }

        function boxBlurSmall(src, w, h, r) {
            const tmp = new Float32Array(w * h);
            const out = new Float32Array(w * h);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    let acc = 0, n = 0;
                    for (let d = -r; d <= r; d++) {
                        const xx = x + d;
                        if (xx >= 0 && xx < w) { acc += src[y * w + xx]; n++; }
                    }
                    tmp[y * w + x] = acc / n;
                }
            }
            for (let x = 0; x < w; x++) {
                for (let y = 0; y < h; y++) {
                    let acc = 0, n = 0;
                    for (let d = -r; d <= r; d++) {
                        const yy = y + d;
                        if (yy >= 0 && yy < h) { acc += tmp[yy * w + x]; n++; }
                    }
                    out[y * w + x] = acc / n;
                }
            }
            return out;
        }

        function sampleBilinear(m, w, h, fx, fy) {
            const x0 = Math.max(0, Math.min(w - 1, Math.floor(fx)));
            const y0 = Math.max(0, Math.min(h - 1, Math.floor(fy)));
            const x1 = Math.min(w - 1, x0 + 1), y1 = Math.min(h - 1, y0 + 1);
            const tx = Math.max(0, Math.min(1, fx - x0)), ty = Math.max(0, Math.min(1, fy - y0));
            const a = m[y0 * w + x0], b = m[y0 * w + x1];
            const c = m[y1 * w + x0], d = m[y1 * w + x1];
            return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
        }

        function shadowsHighlights(data, w, h, shadow, highlight, radius) {
            if (shadow === 0 && highlight === 0) return;
            const { map, bw, bh } = localLuma(data, w, h, Math.max(2, Math.round(radius)));
            const s = shadow / 100, hi = highlight / 100;
            for (let y = 0; y < h; y++) {
                const fy = (y + 0.5) * bh / h - 0.5;
                for (let x = 0; x < w; x++) {
                    const o = (y * w + x) * 4;
                    const lb = sampleBilinear(map, bw, bh, (x + 0.5) * bw / w - 0.5, fy) / 255;
                    const r = data[o], g = data[o + 1], b = data[o + 2];
                    const lum = (r * 0.2126 + g * 0.7152 + b * 0.0722) / 255;
                    const f = 1 + s * ((1 - lb) * (1 - lb) * (1 - lum)) * 0.9
                                - hi * (lb * lb * lum) * 0.45;
                    data[o] = Math.max(0, Math.min(255, r * f));
                    data[o + 1] = Math.max(0, Math.min(255, g * f));
                    data[o + 2] = Math.max(0, Math.min(255, b * f));
                }
            }
        }

        // ======================================================== 动态范围压缩
        // 照搬 epdoptimize 的做法：strength 混合 + 饱和度保护 + 压完自检。
        function chromaProtection(r, g, b) {
            return smoothstep(0.18, 0.68, getSaturation(r, g, b)) * 0.85;
        }

        function isProtectedChromaFit(srcLuma, r, g, b, srcSat) {
            if (srcSat < 0.16) return true;
            if (getSaturation(r, g, b) >= Math.max(0.12, srcSat * 0.72)) return true;
            return (r * 0.2126 + g * 0.7152 + b * 0.0722) <= srcLuma + 4;
        }

        function compressToPanel(data, w, h, palette, strength) {
            if (strength <= 0) return;
            const blackL = palette.Lmin, whiteL = palette.Lmax;
            const targetRange = whiteL - blackL;
            if (targetRange <= 0) return;

            const BINS = 256, SCALE = BINS / 100;
            const hist = new Uint32Array(BINS);
            const n = w * h;
            for (let i = 0; i < data.length; i += 4) {
                const lab = rgbToLab(data[i], data[i + 1], data[i + 2]);
                hist[Math.max(0, Math.min(BINS - 1, Math.round(lab[0] * SCALE)))]++;
            }
            const pct = (p) => {
                const target = Math.round((n - 1) * p);
                let seen = 0;
                for (let b = 0; b < BINS; b++) { seen += hist[b]; if (seen > target) return b / SCALE; }
                return 100;
            };
            const srcBlack = pct(0.01), srcWhite = pct(0.99);
            const srcRange = srcWhite - srcBlack;
            if (srcRange <= 0.0001) return;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i + 1], b = data[i + 2];
                const lab = rgbToLab(r, g, b);
                const L = lab[0], A = lab[1], B = lab[2];
                const srcLuma = r * 0.2126 + g * 0.7152 + b * 0.0722;
                const srcSat = getSaturation(r, g, b);
                const norm = Math.max(0, Math.min(1, (L - srcBlack) / srcRange));
                const compressedL = blackL + norm * targetRange;
                const eff = strength * (1 - chromaProtection(r, g, b));
                const targetL = L + (compressedL - L) * eff;
                const rgb = labToRgb(targetL, A, B);
                let nr = rgb[0], ng = rgb[1], nb = rgb[2];
                if (compressedL > L && !isProtectedChromaFit(srcLuma, nr, ng, nb, srcSat)) {
                    let lo = 0, hi = eff;
                    nr = r; ng = g; nb = b;
                    for (let step = 0; step < 5; step++) {
                        const mid = (lo + hi) / 2;
                        const cand = labToRgb(L + (compressedL - L) * mid, A, B);
                        if (isProtectedChromaFit(srcLuma, cand[0], cand[1], cand[2], srcSat)) {
                            lo = mid; nr = cand[0]; ng = cand[1]; nb = cand[2];
                        } else { hi = mid; }
                    }
                }
                data[i] = nr; data[i + 1] = ng; data[i + 2] = nb;
            }
        }

        // ======================================================== 色调
        function applyTone(data, w, h) {
            const auto = el('cbAuto').checked;
            const bright = Number(el('rBright').value);
            const contrast = Number(el('rContrast').value);
            if (!auto && bright === 0 && contrast === 0) return null;

            let lo = 0, hi = 255;
            if (auto) {
                const hist = new Uint32Array(256);
                for (let i = 0; i < data.length; i += 4) {
                    hist[(data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8]++;
                }
                const total = data.length / 4;
                let acc = 0;
                for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= total * 0.01) { lo = v; break; } }
                acc = 0;
                for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= total * 0.99) { hi = v; break; } }
                if (hi - lo < 8) { lo = 0; hi = 255; }
            }
            const OUT_LO = Number(el('rBlack').value), OUT_HI = 247;
            const cf = (100 + contrast) / 100;
            const bf = bright * 2.55;
            const lut = new Uint8Array(256);
            for (let v = 0; v < 256; v++) {
                let x = OUT_LO + (v - lo) / (hi - lo) * (OUT_HI - OUT_LO);
                x = (x - 128) * cf + 128 + bf;
                lut[v] = Math.max(0, Math.min(255, Math.round(x)));
            }
            for (let i = 0; i < data.length; i += 4) {
                data[i] = lut[data[i]];
                data[i + 1] = lut[data[i + 1]];
                data[i + 2] = lut[data[i + 2]];
            }
            shadowsHighlights(data, w, h,
                Number(el('rShadow').value), Number(el('rHighlight').value),
                Number(el('rRadius').value));
            const sat = Number(el('rSat').value), tint = Number(el('rTint').value);
            if (sat !== 0 || tint !== 0) {
                const k = 1 + sat / 100;
                for (let i = 0; i < data.length; i += 4) {
                    const lab = rgbToLab(data[i], data[i + 1], data[i + 2]);
                    const rgb = labToRgb(lab[0], lab[1] * k, lab[2] * k + tint);
                    data[i] = rgb[0]; data[i + 1] = rgb[1]; data[i + 2] = rgb[2];
                }
            }
            return { lo, hi };
        }

        // ======================================================== 量化 + 抖动
        function quantize(pixels, w, h, palette, activeIdx, kernelName, lWeight, ditherScale, serpentine, chromaGuard, pureSat) {
            const colors = palette.colors;
            const kernel = KERNELS[kernelName] || [];
            const ds = (ditherScale === undefined ? 100 : ditherScale) / 100;
            const list = activeIdx && activeIdx.length ? activeIdx : colors.map((_, i) => i);
            const labList = list.map((i) => rgbToLab(colors[i][0], colors[i][1], colors[i][2]));
            const work = new Float32Array(pixels.length);
            for (let i = 0; i < pixels.length; i++) work[i] = pixels[i];
            const out = new Uint8Array(w * h);

            /* 误差累积上限：误差扩散是无上限累积的，源色度超过色板上限时
             * 会把整片区域推成同一个颜色（饱和区死红、细节丢失、斑块断层）。
             * 限在原始值 ±64 之内 —— 正常渐变误差通常 <30，不受影响。 */
            const CLAMP = 64;
            const add = (x, y, dr, dg, db, f) => {
                if (x < 0 || x >= w || y < 0 || y >= h) return;
                const o = (y * w + x) * 4;
                work[o] = Math.max(pixels[o] - CLAMP, Math.min(pixels[o] + CLAMP, work[o] + dr * f));
                work[o + 1] = Math.max(pixels[o + 1] - CLAMP, Math.min(pixels[o + 1] + CLAMP, work[o + 1] + dg * f));
                work[o + 2] = Math.max(pixels[o + 2] - CLAMP, Math.min(pixels[o + 2] + CLAMP, work[o + 2] + db * f));
            };

            const lw = lWeight;
            for (let y = 0; y < h; y++) {
                const rev = serpentine && (y & 1);   // 蛇形扫描，打散方向性伪影
                for (let i = 0; i < w; i++) {
                    const x = rev ? (w - 1 - i) : i;
                    const o = (y * w + x) * 4;
                    const r0 = pixels[o], g0 = pixels[o + 1], b0 = pixels[o + 2];
                    const mx = Math.max(r0, Math.max(g0, b0));
                    const mn = Math.min(r0, Math.min(g0, b0));
                    // 用 max-min（色度代理）判定，别用 HSV 饱和度 —— 那对暗色不可靠
                    const k = pureSat ? 0.85 * smoothstep(90, 170, mx - mn) : 0;
                    const keep = 1 - k;

                    const r = k * r0 + keep * Math.max(0, Math.min(255, work[o]));
                    const g = k * g0 + keep * Math.max(0, Math.min(255, work[o + 1]));
                    const b = k * b0 + keep * Math.max(0, Math.min(255, work[o + 2]));

                    const effW = chromaGuard ? lw * (1 - 0.7 * smoothstep(90, 170, mx - mn)) : lw;
                    const [L, A, B] = rgbToLab(r | 0, g | 0, b | 0);
                    let best = list[0], bestD = Infinity;
                    for (let n = 0; n < list.length; n++) {
                        const lab = labList[n];
                        const dL = (L - lab[0]) * effW, dA = A - lab[1], dB = B - lab[2];
                        const d = dL * dL + dA * dA + dB * dB;
                        if (d < bestD) { bestD = d; best = list[n]; }
                    }
                    out[y * w + x] = best;
                    const tc = colors[best];
                    const dr = (r - tc[0]) * ds * keep;
                    const dg = (g - tc[1]) * ds * keep;
                    const db = (b - tc[2]) * ds * keep;
                    for (const [kx, ky, f] of kernel) add(x + (rev ? -kx : kx), y + ky, dr, dg, db, f);
                }
            }
            return out;
        }

        function rotCW(idx, sw, sh) {
            const dw = sh, dh = sw;
            const out = new Uint8Array(dw * dh);
            for (let y = 0; y < dh; y++) {
                const base = y * dw;
                for (let x = 0; x < dw; x++) out[base + x] = idx[(sh - 1 - x) * sw + y];
            }
            return { idx: out, w: dw, h: dh };
        }

        // ======================================================== 色板
        const palettes = {};
        async function loadPalettes() {
            const manifest = await (await fetch('./act/palettes.json', { cache: 'no-store' })).json();
            const list = (Array.isArray(manifest) ? manifest : (manifest.palettes || []))
                .filter((e) => e && typeof e === 'object' && e.file);
            const sel = el('selPalette');
            sel.innerHTML = '';
            for (const e of list) {
                const r = await fetch('./act/' + e.file, { cache: 'no-store' });
                const buf = new Uint8Array(await r.arrayBuffer());
                const colors = [];
                for (let i = 0; i + 2 < buf.length; i += 3) colors.push([buf[i], buf[i + 1], buf[i + 2]]);
                const act = e.active && e.active.length ? e.active : colors.map((_, i) => i);
                let lmin = 100, lmax = 0;
                for (const i of act) {
                    const L = rgbToLab(colors[i][0], colors[i][1], colors[i][2])[0];
                    if (L < lmin) lmin = L;
                    if (L > lmax) lmax = L;
                }
                palettes[e.file] = {
                    colors, active: e.active || null, label: e.label || e.file, Lmin: lmin, Lmax: lmax
                };
                const o = document.createElement('option');
                o.value = e.file;
                o.textContent = e.label || e.file;
                sel.appendChild(o);
            }
        }
        const curPalette = () => palettes[el('selPalette').value] || null;

        /** 黑点 = 面板最暗档位对应的中性灰 sRGB —— 面板属性，自动跟随色板 */
        function autoBlack(palette) {
            const fy = (palette.Lmin + 16) / 116;
            const Y = fy * fy * fy;
            const s = Y <= 0.0031308 ? 12.92 * Y : 1.055 * Math.pow(Y, 1 / 2.4) - 0.055;
            return Math.max(0, Math.min(90, Math.round(s * 255)));
        }

        // ======================================================== 状态
        const state = { img: null, idx: null, w: 0, h: 0 };

        function targetSize() {
            const [w, h] = el('selSize').value.split('x').map(Number);
            return { w, h };
        }

        function drawCover(canvas, img, w, h) {
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const s = Math.max(w / img.width, h / img.height);
            const dw = img.width * s, dh = img.height * s;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
            return ctx.getImageData(0, 0, w, h);
        }

        function refreshButtons() { el('btnSend').disabled = !state.idx; }

        function render() {
            if (!state.img) return;
            const palette = curPalette();
            if (!palette) return;

            const { w, h } = targetSize();
            if (el('cbBlackAuto').checked) setRange('rBlack', autoBlack(palette));

            const imageData = drawCover(el('cvSrc'), state.img, w, h);
            const tone = applyTone(imageData.data, w, h);
            compressToPanel(imageData.data, w, h, palette, Number(el('rPanelMap').value) / 100);

            const t0 = performance.now();
            const qIdx = quantize(imageData.data, w, h, palette, palette.active,
                el('selDither').value, Number(el('rLWeight').value), Number(el('rDither').value),
                el('cbSerpentine').checked, el('cbChromaGuard').checked, el('cbPureSat').checked);
            const ms = performance.now() - t0;

            const cvDst = el('cvDst');
            cvDst.width = w; cvDst.height = h;
            const dctx = cvDst.getContext('2d');
            const out = dctx.createImageData(w, h);
            for (let i = 0; i < qIdx.length; i++) {
                const c = palette.colors[qIdx[i]];
                out.data[i * 4] = c[0]; out.data[i * 4 + 1] = c[1];
                out.data[i * 4 + 2] = c[2]; out.data[i * 4 + 3] = 255;
            }
            dctx.putImageData(out, 0, 0);

            let sendIdx = qIdx, fw = w, fh = h;
            if (w < h) { const r = rotCW(qIdx, w, h); sendIdx = r.idx; fw = r.w; fh = r.h; }
            state.idx = sendIdx; state.w = fw; state.h = fh;

            el('txHint').textContent =
                `预览 ${w}×${h} · 下发 ${fw}×${fh} · 用了 ${new Set(sendIdx).size} 种颜色`
                + ` · 量化 ${ms.toFixed(0)} ms · 传输约 ${(sendIdx.length / 115200).toFixed(1)} 秒`;
            el('toneInfo').textContent = tone ? `自动色阶：把 ${tone.lo}~${tone.hi} 拉到 0~255` : '色调映射已关闭';
            refreshButtons();
        }

        // ======================================================== 滑杆 + 数字框
        const RANGES = ['rBright', 'rContrast', 'rSat', 'rLWeight', 'rPanelMap',
                        'rBlack', 'rShadow', 'rHighlight', 'rRadius', 'rTint', 'rDither'];

        function setRange(id, v) {
            const r = el(id), n = el(id + 'Num');
            const lo = Number(r.min), hi = Number(r.max);
            const c = Math.max(lo, Math.min(hi, Number(v)));
            r.value = c;
            if (n) n.value = c;
        }

        for (const id of RANGES) {
            const r = el(id), n = el(id + 'Num');
            if (!r) continue;
            r.addEventListener('input', () => { if (n) n.value = r.value; render(); });
            if (!n) continue;
            n.addEventListener('input', () => {
                if (n.value === '') return;
                const v = Number(n.value);
                if (Number.isNaN(v)) return;
                r.value = Math.max(Number(r.min), Math.min(Number(r.max), v));
                render();
            });
            n.addEventListener('change', () => {
                const v = Number(n.value);
                const fixed = Number.isNaN(v) ? Number(r.value)
                    : Math.max(Number(r.min), Math.min(Number(r.max), v));
                n.value = fixed; r.value = fixed; render();
            });
            n.addEventListener('keydown', (e) => { if (e.key === 'Enter') n.blur(); });
        }

        for (const id of ['selPalette', 'selDither', 'selSize', 'cbAuto', 'cbSerpentine',
                          'cbChromaGuard', 'cbPureSat', 'cbBlackAuto']) {
            el(id).addEventListener('input', render);
            el(id).addEventListener('change', render);
        }

        // ======================================================== 预设
        const DEFAULTS = {
            palette: '48-color-qual-c025.act',
            dither: 'floyd-steinberg',
            size: '480x720',
            bright: -11, contrast: 0, sat: 0,
            shadow: 0, highlight: 100, radius: 12,
            tint: -10, lWeight: 1.2, ditherAmt: 100,
            panelMap: 0, auto: true, blackAuto: true, serpentine: true,
            chromaGuard: false, pureSat: false,
        };

        const PRESETS = {
            std: { ...DEFAULTS },
            bright: { ...DEFAULTS, bright: -2, shadow: 40, highlight: 60 },
            vivid: { ...DEFAULTS, sat: 30, contrast: 5 },
            rescue: { ...DEFAULTS, highlight: 100, shadow: 25, panelMap: 55 },
        };

        function currentSettings() {
            return {
                palette: el('selPalette').value, dither: el('selDither').value, size: el('selSize').value,
                bright: Number(el('rBright').value), contrast: Number(el('rContrast').value),
                sat: Number(el('rSat').value), shadow: Number(el('rShadow').value),
                highlight: Number(el('rHighlight').value), radius: Number(el('rRadius').value),
                tint: Number(el('rTint').value), lWeight: Number(el('rLWeight').value),
                ditherAmt: Number(el('rDither').value), panelMap: Number(el('rPanelMap').value),
                auto: el('cbAuto').checked, blackAuto: el('cbBlackAuto').checked,
                serpentine: el('cbSerpentine').checked, chromaGuard: el('cbChromaGuard').checked,
                pureSat: el('cbPureSat').checked,
            };
        }

        function applySettings(s) {
            if (!s) return;
            if (s.palette && palettes[s.palette]) el('selPalette').value = s.palette;
            if (s.dither) el('selDither').value = s.dither;
            if (s.size) el('selSize').value = s.size;
            setRange('rBright', s.bright ?? 0); setRange('rContrast', s.contrast ?? 0);
            setRange('rSat', s.sat ?? 0); setRange('rShadow', s.shadow ?? 0);
            setRange('rHighlight', s.highlight ?? 0); setRange('rRadius', s.radius ?? 12);
            setRange('rTint', s.tint ?? 0); setRange('rLWeight', s.lWeight ?? 1.2);
            setRange('rDither', s.ditherAmt ?? 100); setRange('rPanelMap', s.panelMap ?? 0);
            el('cbAuto').checked = s.auto !== false;
            el('cbBlackAuto').checked = s.blackAuto !== false;
            el('cbSerpentine').checked = s.serpentine !== false;
            el('cbChromaGuard').checked = s.chromaGuard === true;
            el('cbPureSat').checked = s.pureSat === true;
            render();
        }

        for (const b of document.querySelectorAll('button.preset')) {
            b.addEventListener('click', () => applySettings(PRESETS[b.dataset.preset]));
        }
        el('btnResetTone').addEventListener('click', () => applySettings(DEFAULTS));
        el('btnSaveDefault').addEventListener('click', () => {
            localStorage.setItem('epd_defaults', JSON.stringify(currentSettings()));
            say('✓ 已存为默认 —— 下次打开就是这套参数', 'l-ok');
        });

        // ======================================================== 选图
        const fileInput = el('file');
        el('btnPick').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));

        const overlay = el('dropOverlay');
        let dragDepth = 0;
        window.addEventListener('dragenter', (e) => {
            e.preventDefault(); dragDepth++; overlay.classList.add('on');
        });
        window.addEventListener('dragover', (e) => {
            e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
        });
        window.addEventListener('dragleave', (e) => {
            e.preventDefault(); dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) overlay.classList.remove('on');
        });
        window.addEventListener('drop', (e) => {
            e.preventDefault(); dragDepth = 0; overlay.classList.remove('on');
            const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (f) loadFile(f);
        });
        window.addEventListener('paste', (e) => {
            for (const it of e.clipboardData.items) {
                if (it.type.startsWith('image/')) { loadFile(it.getAsFile()); break; }
            }
        });

        async function loadFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const url = URL.createObjectURL(file);
            const img = new Image();
            await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
            state.img = img;
            el('emptyHint').classList.add('hide');
            say('已载入：' + file.name, 'l-ok');
            render();
        }

        // ======================================================== 下发
        async function send() {
            if (!state.idx) return;
            const base = wifiBase();
            if (!base) { say('还没填设备 IP —— 点「从串口读取」，或在串口里敲 e 看', 'l-err'); return; }

            const n = state.idx.length;
            say(`正在下发 ${n} 字节（约 ${(n / 115200).toFixed(1)} 秒 + 面板刷新 15 秒）…`);
            el('prog').style.width = '35%';
            el('btnSend').disabled = true;
            const t0 = performance.now();
            const r = await api('/raw', { method: 'POST', body: state.idx }, 120000);
            const dt = ((performance.now() - t0) / 1000).toFixed(1);
            el('prog').style.width = '100%';
            setTimeout(() => { el('prog').style.width = '0'; }, 1500);
            el('btnSend').disabled = false;

            if (r && r.ok) {
                say(`✓ 下发完成（${dt} 秒，含面板刷新）`, 'l-ok');
                el('dot').classList.add('on');
                el('status').textContent = '在线 ' + el('ipAddr').value.trim();
            } else {
                say('✗ 下发失败：' + ((r && (r.error || r.err)) || '设备没响应'), 'l-err');
            }
        }
        el('btnSend').addEventListener('click', () => { send().catch((e) => say('出错：' + e.message, 'l-err')); });

        // ======================================================== 读设备 IP
        el('btnProbe').addEventListener('click', async () => {
            say('正在从串口读设备 IP…（打开串口会让板子重启一次，2~3 秒后自动重连）');
            const r = await assistant('/device');
            if (r.ok && r.ip) {
                el('ipAddr').value = r.ip;
                localStorage.setItem('epd_ip', r.ip);
                el('dot').classList.add('on');
                el('status').textContent = '在线 ' + r.ip;
                say('✓ 设备 IP = ' + r.ip, 'l-ok');
            } else {
                say('✗ 没读到 IP。板子起来了吗？串口被别的程序占着吗？也可以直接在串口里敲 e', 'l-err');
            }
        });

        // ======================================================== 启动
        await loadPalettes();
        refreshButtons();

        const savedIp = localStorage.getItem('epd_ip');
        if (savedIp) el('ipAddr').value = savedIp;
        el('ipAddr').addEventListener('change', () => {
            localStorage.setItem('epd_ip', el('ipAddr').value.trim());
            el('status').textContent = wifiBase() ? '在线 ' + el('ipAddr').value.trim() : '待填 IP';
        });
        el('status').textContent = wifiBase() ? '在线 ' + el('ipAddr').value.trim() : '待填 IP';
        if (wifiBase()) el('dot').classList.add('on');

        let savedTone = null;
        try { savedTone = JSON.parse(localStorage.getItem('epd_defaults') || 'null'); } catch (e) { /* 忽略 */ }
        applySettings(savedTone || DEFAULTS);

        if (!wifiBase()) {
            say('还没读到设备 IP —— 点「从串口读取」，或在串口里敲 e 看设备打印的地址。');
        } else {
            say('就绪。把图片拖进来，调好参数后点右上角「下发」。');
        }
    </script>
</body>
